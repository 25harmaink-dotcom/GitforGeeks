<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitForGeeks</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
      color: #17201a;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 24px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(22, 101, 52, 0.10);
    }

    .github {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      color: #166534;
    }

    .brand {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 30px;
    }

    .brand span {
      color: #15803d;
    }

    .brand::after {
      content: "";
      display: block;
      width: 55px;
      height: 4px;
      margin: 12px auto 0;
      border-radius: 10px;
      background: #22c55e;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 14px;
      color: #17201a;
    }

    p {
      max-width: 560px;
      margin: auto;
      color: #4b6353;
      font-size: 17px;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-top: 28px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 22px;
      }

      .brand {
        font-size: 38px;
      }

      h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <svg xmlns="http://www.w3.org/2000/svg" class="github" viewBox="0 0 16 16">
      <path
        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
    </svg>

    <div class="brand">
      GitForGeeks
    </div>

    <h2>Hi, I'm Khudaija and Alhamda and Radhika👋 </h2>

    <p>
      I'm learning Git & GitHub and getting started with
      version control, branches, commits, collaboration,
      and open source.
    </p>

    <span class="tag">
      Learning Git • One Commit at a Time
    </span>

  </main>

</body>

</html>
